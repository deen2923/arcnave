# ARCNAVE on Cloudflare Workers, free plan, no card (DEPLOY-CLOUDFLARE-ONLY.md).
#   node deploy/cloudflare/build.mjs https://arcnave.<your-subdomain>.workers.dev
#   npx wrangler login
#   npx wrangler deploy --config deploy/cloudflare/wrangler.toml
name = "arcnave"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "../out/cf"
binding = "ASSETS"
# a path with no file (a new sky tile, a /_c answer the PC did not have) goes to worker.js
not_found_handling = "none"
